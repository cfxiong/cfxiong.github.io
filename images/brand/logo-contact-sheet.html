<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CFX Logo Alternatives</title>
  <style>
    :root {
      color: #17324d;
      background: #eef3f7;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 40px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 28px;
      color: #55708a;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 22px;
    }
    figure {
      margin: 0;
      padding: 18px;
      border: 1px solid #d8e2eb;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(23, 50, 77, 0.08);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
    figcaption {
      margin-top: 12px;
      color: #33485d;
      font-size: 14px;
      line-height: 1.45;
    }
    strong {
      display: block;
      color: #17324d;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>CFX Logo Alternatives</h1>
  <p>Vector drafts for the Chenfeng Xiong homepage sidebar identity.</p>
  <main class="grid">
    <figure>
      <img src="cfx-a1-network-x.svg" alt="CFX Network X monogram">
      <figcaption><strong>A1 Network X</strong>Most direct transportation-network signal. Strong small-logo candidate.</figcaption>
    </figure>
    <figure>
      <img src="cfx-a2-od-flow.svg" alt="CFX Origin-Destination Flow monogram">
      <figcaption><strong>A2 Origin-Destination Flow</strong>Softer mobility-data feel, with C and X both treated as routes.</figcaption>
    </figure>
    <figure>
      <img src="cfx-a3-block-cut.svg" alt="CFX Block monogram with route cut">
      <figcaption><strong>A3 Block Cut</strong>Most minimal and academic. Good if the sidebar should stay restrained.</figcaption>
    </figure>
    <figure>
      <img src="cfx-b1-name-route.svg" alt="Chenfeng Xiong wordmark with route underline">
      <figcaption><strong>B1 Name Route</strong>Full-name wordmark with understated route underline.</figcaption>
    </figure>
    <figure>
      <img src="cfx-b2-x-crossing.svg" alt="Chenfeng Xiong wordmark with crossing X">
      <figcaption><strong>B2 X Crossing</strong>Personalized treatment of the X in Xiong as crossing routes.</figcaption>
    </figure>
    <figure>
      <img src="cfx-ab1-sidebar-badge.svg" alt="CFX sidebar badge identity">
      <figcaption><strong>A+B1 Sidebar Badge</strong>Combined monogram and full name, designed for the left sidebar.</figcaption>
    </figure>
  </main>
</body>
</html>
