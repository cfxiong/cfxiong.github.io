<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-labelledby="title desc">
  <title id="title">Chenfeng Xiong wordmark with crossing X</title>
  <desc id="desc">A full-name wordmark where the X in Xiong is treated as crossing mobility routes.</desc>
  <rect width="520" height="160" rx="18" fill="#ffffff"/>
  <text x="28" y="82" fill="#17324d" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="760" letter-spacing="-0.6">Chenfeng</text>
  <text x="258" y="82" fill="#17324d" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="760" letter-spacing="-0.6">iong</text>
  <g fill="none" stroke-linecap="round">
    <path d="M232 48c11 12 22 24 36 34" stroke="#17324d" stroke-width="7"/>
    <path d="M268 48c-14 10-25 22-36 34" stroke="#2b6f8f" stroke-width="7"/>
  </g>
  <g fill="#2b6f8f">
    <circle cx="232" cy="48" r="4.5"/>
    <circle cx="268" cy="48" r="4.5"/>
    <circle cx="250" cy="65" r="5.5"/>
    <circle cx="232" cy="82" r="4.5"/>
    <circle cx="268" cy="82" r="4.5"/>
  </g>
  <text x="30" y="116" fill="#55708a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="650">Measuring mobility systems at scale</text>
</svg>
